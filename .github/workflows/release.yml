name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package extension
        run: |
          zip -r "mask-your-web-${GITHUB_REF_NAME}.zip" \
            manifest.json background.js \
            content popup options shared assets _locales \
            -x "*.DS_Store"

      - name: Create release & attach zip
        uses: softprops/action-gh-release@v2
        with:
          files: mask-your-web-*.zip
          generate_release_notes: true
